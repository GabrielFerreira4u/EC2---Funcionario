<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Funcionários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Gestão de Funcionários</span>
    </div>
  </nav>

  <main class="container pb-5">

    <!-- avisos (substituem os alert()) -->
    <div id="avisos"></div>

    <!-- resumo -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <div class="text-muted small">Total de funcionários</div>
            <div class="fs-3 fw-bold" id="resumoTotal">0</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <div class="text-muted small">Média salarial</div>
            <div class="fs-3 fw-bold" id="resumoMedia">–</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <div class="text-muted small">Cargos distintos</div>
            <div class="fs-3 fw-bold" id="resumoCargos">0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">

      <!-- formulário -->
      <div class="col-12 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold" id="tituloForm">Cadastrar funcionário</div>
          <div class="card-body">
            <form id="formFuncionario" novalidate>
              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome">
              </div>
              <div class="mb-3">
                <label for="idade" class="form-label">Idade</label>
                <input type="number" class="form-control" id="idade" min="0">
              </div>
              <div class="mb-3">
                <label for="cargo" class="form-label">Cargo</label>
                <input type="text" class="form-control" id="cargo">
              </div>
              <div class="mb-3">
                <label for="salario" class="form-label">Salário</label>
                <div class="input-group">
                  <span class="input-group-text">R$</span>
                  <input type="number" class="form-control" id="salario" min="0" step="0.01">
                </div>
              </div>
              <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary" id="btnSalvar">Cadastrar</button>
                <button type="button" class="btn btn-outline-secondary" id="btnCancelar" hidden>Cancelar edição</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- busca + tabela -->
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Funcionários cadastrados</div>
          <div class="card-body border-bottom">
            <div class="input-group">
              <input type="text" class="form-control" id="campoBusca" placeholder="Buscar por nome">
              <button type="button" class="btn btn-outline-primary" id="btnBuscar">Buscar</button>
              <button type="button" class="btn btn-outline-secondary" id="btnTodos">Mostrar todos</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>ID</th><th>Nome</th><th>Idade</th><th>Cargo</th><th>Salário</th><th class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaFuncionarios"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- relatórios -->
    <div class="card shadow-sm mt-4">
      <div class="card-header fw-semibold">Relatórios</div>
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-3">
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnAcima5000">Salário acima de R$ 5.000</button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnMedia">Média salarial</button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnCargos">Cargos únicos</button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnMaiusculo">Nomes em maiúsculo</button>
        </div>
        <pre class="bg-body-secondary rounded p-3 mb-0" id="relatorio">Escolha um relatório acima.</pre>
      </div>
    </div>

  </main>

  <script src="funcionario.js"></script>
  <script src="app.js"></script>
</body>
</html>
