<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Funcionários</title>
</head>
<body>
  <h1>Cadastro de Funcionários</h1>

  <form id="formFuncionario">
    <p><label>Nome: <input type="text" id="nome"></label></p>
    <p><label>Idade: <input type="number" id="idade" min="0"></label></p>
    <p><label>Cargo: <input type="text" id="cargo"></label></p>
    <p><label>Salário (R$): <input type="number" id="salario" min="0" step="0.01"></label></p>
    <button type="button" id="btnSalvar">Cadastrar</button>
    <button type="button" id="btnCancelar" hidden>Cancelar edição</button>
  </form>

  <h2>Funcionários cadastrados</h2>
  <p>
    <input type="text" id="campoBusca" placeholder="Buscar por nome">
    <button type="button" id="btnBuscar">Buscar</button>
    <button type="button" id="btnTodos">Mostrar todos</button>
  </p>
  <table border="1" cellpadding="4">
    <thead>
      <tr><th>ID</th><th>Nome</th><th>Idade</th><th>Cargo</th><th>Salário</th><th>Ações</th></tr>
    </thead>
    <tbody id="tabelaFuncionarios"></tbody>
  </table>

  <script src="funcionario.js"></script>
  <script src="app.js"></script>
</body>
</html>
